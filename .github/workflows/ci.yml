name: macOS source checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Full test suite (test-owned fixtures only)
        run: swift test --jobs 2
      - name: Build and verify local candidate
        run: ./scripts/build.sh
      - name: Curated source archive
        run: python3 scripts/public_source.py
      - name: Whitespace validation
        run: git diff --check
      - name: Package development candidate
        run: |
          candidate="$(cat dist/latest-candidate.txt)"
          lipo -verify_arch arm64 "$candidate/Contents/MacOS/Cleaner"
          ditto -c -k --sequesterRsrc --keepParent "$candidate" dist/AgenticClean-development-arm64.zip
          shasum -a 256 dist/AgenticClean-development-arm64.zip > dist/AgenticClean-development-arm64.zip.sha256
          cp "$candidate/Contents/Info.plist" dist/development-candidate-info.plist
      - name: Preserve development candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-candidate-arm64
          path: |
            dist/AgenticClean-development-arm64.zip
            dist/AgenticClean-development-arm64.zip.sha256
            dist/development-candidate-info.plist
            dist/AgenticClean-*-source.tar.gz
          if-no-files-found: error
          retention-days: 7
  native-ui:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install native project generator
        run: brew install xcodegen
      - name: Native helper review journeys (synthetic actions only)
        run: ./scripts/test-native-ui.sh
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-helper-review-evidence
          path: |
            dist/verification/native-ui-*/host.json
            dist/verification/native-ui-*/source-manifest.json
            dist/verification/native-ui-*/xcodebuild.log
            dist/verification/native-ui-*/result-verification.json
            dist/verification/native-ui-*/NativeUI.xcresult/
          if-no-files-found: error
          retention-days: 7
